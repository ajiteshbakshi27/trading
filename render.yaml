# Render Blueprint for the Parakh backend (free plan).
# Render Dashboard -> New -> Blueprint -> pick this repo, then fill the
# "sync: false" values in the dashboard. Step-by-step: see DEPLOY.md.
#
# Free plan notes:
# - One worker, state kept in memory. Fine for a demo and first users.
# - The free server sleeps after ~15 minutes without visitors; the first
#   request after that takes up to a minute. Open the site before a demo.
# - The daily jobs (resolve ideas, hype alerts) run from GitHub Actions
#   (.github/workflows/jobs.yml), because Render cron jobs are paid.
# When you move to a paid plan: add a Redis service, set REDIS_URL, and
# raise --workers.
services:
  - type: web
    name: parakh-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ENVIRONMENT
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: PUBLIC_APP_URL
        sync: false # https://<your-app>.vercel.app
      - key: CORS_ORIGINS
        sync: false # https://<your-app>.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # Optional. Leave empty until you use them.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: KITE_API_KEY
        sync: false
      - key: KITE_API_SECRET
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
